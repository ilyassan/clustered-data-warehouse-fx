services:
  postgres:
    image: postgres:16-alpine
    container_name: fx-deals-postgres
    environment:
      POSTGRES_DB: fx_deals_warehouse
      POSTGRES_USER: fxuser
      POSTGRES_PASSWORD: fxpass123
    ports:
      - "5455:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fx-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fxuser -d fx_deals_warehouse"]
      interval: 10s
      timeout: 5s
      retries: 5

  fx-deals-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fx-deals-app
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/fx_deals_warehouse
      SPRING_DATASOURCE_USERNAME: fxuser
      SPRING_DATASOURCE_PASSWORD: fxpass123
    ports:
      - "8080:8080"
    networks:
      - fx-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  fx-network:
    driver: bridge
